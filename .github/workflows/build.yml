name: Build and release Windows app

# Every push to main builds the app, numbers it 1.0.<run number>, and publishes it as a GitHub release.
# Installed apps check these releases and update themselves.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Set version
        shell: bash
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version
      - name: Build and publish release
        run: npx electron-builder --win nsis portable --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Add a fixed-name installer for the permanent download link
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="1.0.${{ github.run_number }}"
          cp "dist/PhasmoGhostFinder-Setup-$v.exe" "dist/PhasmoGhostFinder-Setup.exe"
          gh release upload "v$v" "dist/PhasmoGhostFinder-Setup.exe" --clobber --repo "${{ github.repository }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PhasmoGhostFinder-windows
          path: dist/*.exe
          if-no-files-found: error
